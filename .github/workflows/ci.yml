name: RAG CI Pipeline

on:
  push:
    paths:
      - "k8s.txt"
      - "main.py"
      - "build_knowledge_base.py"
      - "semantic_test.py"

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn chromadb ollama requests

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > ollama.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:11434/api/tags; then
              break
            fi
            sleep 2
          done
          ollama pull nomic-embed-text
          ollama pull qwen2.5:0.5b

      - name: Rebuild knowledge base
        run: python build_knowledge_base.py

      - name: Start API
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 > api.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/openapi.json; then
              break
            fi
            sleep 2
          done

      - name: Run semantic tests
        run: python semantic_test.py

      - name: Success
        run: echo "✅ All tests passed! RAG quality maintained."
